name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (typecheck, build, edge-evaluator unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (edge-evaluator)
        run: npm test --workspace @rollout-platform/edge-evaluator

  go:
    name: Go (build, vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rollout-controller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
