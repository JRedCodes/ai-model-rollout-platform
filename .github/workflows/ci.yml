name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (typecheck, build, edge-evaluator unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (edge-evaluator)
        run: npm test --workspace @rollout-platform/edge-evaluator

      - name: Start Redis
        run: docker compose up -d --wait redis

      - name: Start model-service
        run: |
          nohup node apps/model-service/dist/server.js > model-service.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4001/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "model-service did not become healthy in time" >&2
          cat model-service.log
          exit 1

      - name: Integration tests (edge-evaluator)
        run: npm run test:integration --workspace @rollout-platform/edge-evaluator

      - name: Show model-service log
        if: always()
        run: cat model-service.log || true

      - name: Tear down Redis
        if: always()
        run: docker compose down

  go:
    name: Go (build, vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rollout-controller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/rollout-controller/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
