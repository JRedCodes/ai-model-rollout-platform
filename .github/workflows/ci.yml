name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (typecheck, build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (edge-evaluator)
        run: npm test --workspace @rollout-platform/edge-evaluator

      - name: Unit tests (model-service)
        run: npm test --workspace @rollout-platform/model-service

      - name: Unit tests (contracts)
        run: npm test --workspace @rollout-platform/contracts

      - name: Unit tests (dashboard)
        run: npm test --workspace @rollout-platform/dashboard

      - name: Start Redis
        run: docker compose up -d --wait redis

      - name: Start model-service
        run: |
          nohup node apps/model-service/dist/server.js > model-service.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4001/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "model-service did not become healthy in time" >&2
          cat model-service.log
          exit 1

      - name: Integration tests (edge-evaluator)
        run: npm run test:integration --workspace @rollout-platform/edge-evaluator

      - name: Show model-service log
        if: always()
        run: cat model-service.log || true

      - name: Tear down Redis
        if: always()
        run: docker compose down

  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rollout-controller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/rollout-controller/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

  go-integration:
    name: Go (integration tests)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://jakeredding@localhost:5432/rollout_platform
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/rollout-controller/go.sum

      - name: Start Postgres + Redis
        run: docker compose up -d --wait postgres redis

      - name: Integration tests
        working-directory: apps/rollout-controller
        run: go test -tags=integration ./... -race

      - name: Tear down Postgres + Redis
        if: always()
        run: docker compose down

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://jakeredding@localhost:5432/rollout_platform
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/rollout-controller/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium

      - name: Build TS workspaces
        run: npm run build

      - name: Start Postgres + Redis
        run: docker compose up -d --wait postgres redis

      - name: Start model-service
        run: |
          nohup node apps/model-service/dist/server.js > model-service.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/health > /dev/null && exit 0
            sleep 1
          done
          echo "model-service did not become healthy in time" >&2
          cat model-service.log
          exit 1

      - name: Start edge-evaluator
        run: |
          nohup node apps/edge-evaluator/dist/server.js > edge-evaluator.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4002/health > /dev/null && exit 0
            sleep 1
          done
          echo "edge-evaluator did not become healthy in time" >&2
          cat edge-evaluator.log
          exit 1

      - name: Build and start rollout-controller
        working-directory: apps/rollout-controller
        run: |
          go build -o rollout-controller .
          nohup ./rollout-controller > ../../rollout-controller.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4003/health > /dev/null && exit 0
            sleep 1
          done
          echo "rollout-controller did not become healthy in time" >&2
          cat ../../rollout-controller.log
          exit 1

      - name: Start dashboard
        working-directory: apps/dashboard
        run: |
          nohup npm run dev > ../../dashboard.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 1
          done
          echo "dashboard did not become healthy in time" >&2
          cat ../../dashboard.log
          exit 1

      - name: Run Playwright tests
        working-directory: apps/dashboard
        run: npx playwright test

      - name: Show service logs
        if: always()
        run: |
          echo "--- model-service ---"; cat model-service.log || true
          echo "--- edge-evaluator ---"; cat edge-evaluator.log || true
          echo "--- rollout-controller ---"; cat rollout-controller.log || true
          echo "--- dashboard ---"; cat dashboard.log || true

      - name: Tear down Postgres + Redis
        if: always()
        run: docker compose down
