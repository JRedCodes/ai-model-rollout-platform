# Mirrors vite.config.ts's dev-server proxy (/api -> rollout-controller),
# so the built app can keep using the default VITE_API_URL=/api unchanged
# in docker-compose -- no rebuild-with-a-different-URL needed just to run
# it containerized. try_files handles client-side routing (router.ts uses
# history.pushState) falling back to index.html instead of a raw 404.

server {
    listen 80;

    location /api/events {
        proxy_pass http://rollout-controller:4003/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://rollout-controller:4003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
