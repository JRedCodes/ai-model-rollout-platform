services:
  redis:
    image: redis:7-alpine
    container_name: rollout-platform-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # For CI and anyone who'd rather not install Postgres.app locally. Matches
  # the rollout-controller's default DATABASE_URL (trust auth, no password,
  # user/db both "jakeredding"/"rollout_platform"). If you already run
  # Postgres.app on port 5432 for local dev per the README, don't start this
  # service alongside it -- they'll fight over the port.
  postgres:
    image: postgres:18-alpine
    container_name: rollout-platform-postgres
    environment:
      POSTGRES_USER: jakeredding
      POSTGRES_DB: rollout_platform
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ images store data in a major-version-specific
      # subdirectory under /var/lib/postgresql, not directly at
      # /var/lib/postgresql/data -- mounting the volume there (the old
      # convention) makes the image refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jakeredding -d rollout_platform"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data: